name: native-c

# CI uses committed layout sources and synthetic fixtures, never disc data.
# Windows also builds the game and the portable graphics test group; gameplay
# and renderer traversal still require local owner-disc validation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No game data in the repository
        run: tools/ci/check_no_game_data.sh

  host-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            renderer: sdl3_gpu
          - os: ubuntu-24.04
            name: Linux x86-64
            renderer: sdl3_gpu
          - os: ubuntu-24.04
            name: Linux OpenGL
            renderer: sdl3_gl
    name: host tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PSYZ_HEADLESS: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdecor-0-dev libvulkan-dev libxtst-dev libxinerama-dev wayland-protocols libdrm-dev libgbm-dev libgles2-mesa-dev xvfb xauth
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DPSYZ_RENDERER=${{ matrix.renderer }}
      - name: Build the host tests
        run: cmake --build build --target host_tests --parallel 4
      - name: Link the OpenGL game and settings UI
        if: matrix.renderer == 'sdl3_gl'
        run: cmake --build build --target parasite-eve-ii-pc --parallel 4
      - name: Run the host tests
        run: |
          if [ "${{ matrix.renderer }}" = "sdl3_gl" ]; then
            xvfb-run -a ctest --test-dir build --output-on-failure --no-tests=error
          else
            ctest --test-dir build --output-on-failure --no-tests=error
          fi

  # The decompiled sources are a minefield for undefined behaviour; this run repeats
  # the host suite under ASan and UBSan. Both abort on the first finding, so any
  # memory error or UB in the tested paths fails the job.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-24.04
            name: Linux x86-64
    name: host tests (sanitizers, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PSYZ_HEADLESS: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdecor-0-dev libvulkan-dev libxtst-dev libxinerama-dev wayland-protocols libdrm-dev libgbm-dev libgles2-mesa-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
             -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
             -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build the host tests
        run: cmake --build build-asan --target host_tests --parallel 4
      - name: Run the host tests
        run: ctest --test-dir build-asan --output-on-failure --no-tests=error

  # The game sources build with -w; this re-runs them with the pointer/int cast
  # warnings on and fails when any appear (README documents the check).
  cast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdecor-0-dev libvulkan-dev libxtst-dev libxinerama-dev wayland-protocols libdrm-dev libgbm-dev libgles2-mesa-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure the game
        run: cmake -S . -B build-casts -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build the game (compile_commands.json)
        run: cmake --build build-casts --target parasite-eve-ii-pc --parallel 4
      - name: Pointer/int cast warnings
        run: tools/ci/check_host_casts.sh build-casts
  windows-graphics:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      PSYZ_HEADLESS: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build game and portable regressions
        run: cmake --build build --parallel 2 --target parasite-eve-ii-pc portable_graphics_tests portable_audio_tests portable_gameplay_tests
      - name: Portable regressions
        run: ctest --test-dir build --output-on-failure --no-tests=error -L "portable-graphics|portable-audio|portable-gameplay"
      - name: The executable starts
        run: |
          out=$(build/parasite-eve-ii-pc.exe --help 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '^usage:'

  save-editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --check --manifest-path save-editor/Cargo.toml
      - name: Lints
        run: cargo clippy --manifest-path save-editor/Cargo.toml --locked -- -D warnings
      - name: Test the save editor
        run: cargo test --manifest-path save-editor/Cargo.toml --locked

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Python tool syntax
        run: python3 -m compileall -q tools
      - name: Python dependencies
        run: pip install --quiet -r requirements.txt
      - name: Fetch PsyZ and SDL for the native decoder
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure the headless native decoder
        run: >-
          cmake -S . -B build-python-tests -DPE_BUILD_GAME=OFF
          -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF
          -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF
          -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF -DSDL_VULKAN=OFF
      - name: Tool regressions
        run: tools/ci/check_python_tests.sh build-python-tests
