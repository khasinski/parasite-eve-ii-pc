name: native-c

# CI has no game data, so it builds and runs the host tests only (PE_BUILD_GAME turns itself off when the generated
# sources are missing). The game executable is built locally from your own disc images; see README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No game data in the repository
        run: tools/ci/check_no_game_data.sh

  host-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-24.04
            name: Linux x86-64
    name: host tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PSYZ_HEADLESS: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdecor-0-dev libvulkan-dev libxtst-dev libxinerama-dev wayland-protocols libdrm-dev libgbm-dev libgles2-mesa-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
      - name: Build the host tests
        run: cmake --build build --target host_tests --parallel 4
      - name: Run the host tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Python tool syntax
        run: python3 -m compileall -q tools
