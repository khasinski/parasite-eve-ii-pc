name: release

# Builds the release archives as workflow artifacts; it never publishes. A tag v* or "Run workflow" runs it, and the
# artifacts are the CI check that a release still builds and packages.
#
# The macOS release itself is signed with the maintainer's Developer ID certificate and notarized, which only works on
# the machine that holds the certificate: run tools/release/release.sh there (it creates a DRAFT GitHub release). The
# macOS archive below is ad-hoc signed and only proves the packaging works. No archive contains game data: the game
# reads the user's own disc images when it starts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the archive names (for example 0.1); empty uses the ref name
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: No game data in the repository
        run: tools/ci/check_no_game_data.sh
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target parasite-eve-ii-pc host_tests
      - name: Host regression tests
        env:
          PSYZ_HEADLESS: '1'
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: The executable starts
        run: |
          out=$(build/parasite-eve-ii-pc --help 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '^usage:'
      - name: Package (ad-hoc signed)
        run: |
          version=${{ inputs.version }}
          version=${version:-${GITHUB_REF_NAME:-dev}}
          version=${version#v}
          cargo build --manifest-path save-editor/Cargo.toml --locked --release
          archive=$(tools/release/package_app.sh build/parasite-eve-ii-pc "$version" dist "" save-editor/target/release/pe2-save-editor | tail -n1)
          (cd dist && shasum -a 256 "$(basename "$archive")" > SHA256SUMS)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            ${{ env.ARCHIVE }}
            dist/SHA256SUMS

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdecor-0-dev libvulkan-dev libxtst-dev libxinerama-dev wayland-protocols libdrm-dev libgbm-dev libgles2-mesa-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: No game data in the repository
        run: tools/ci/check_no_game_data.sh
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target parasite-eve-ii-pc host_tests
      - name: Host regression tests
        env:
          PSYZ_HEADLESS: '1'
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: The executable starts
        run: |
          out=$(build/parasite-eve-ii-pc --help 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '^usage:'
      - name: Build the save editor
        run: cargo build --manifest-path save-editor/Cargo.toml --locked --release
      - name: Package
        run: |
          version=${{ inputs.version }}
          version=${version:-${GITHUB_REF_NAME:-dev}}
          version=${version#v}
          name=Parasite-Eve-II-${version}-linux-${{ matrix.arch }}
          editor=Parasite-Eve-II-Save-Editor-${version}-linux-${{ matrix.arch }}
          mkdir -p "dist/$name" "dist/$editor"
          cp build/parasite-eve-ii-pc "dist/$name/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md recomplauncher.json "dist/$name/"
          ldd build/parasite-eve-ii-pc > "dist/$name/runtime-dependencies.txt"
          git rev-parse HEAD > "dist/$name/source-commit.txt"
          cp save-editor/target/release/pe2-save-editor LICENSE "dist/$editor/"
          echo "Run pe2-save-editor on a COPY of your save (the card0 folder in the game's data directory). Untested against retail saves." > "dist/$editor/README.txt"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          tar -czf "dist/$editor.tar.gz" -C dist "$editor"
          (cd dist && sha256sum "$name.tar.gz" "$editor.tar.gz" > SHA256SUMS-linux-${{ matrix.arch }})
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-linux-${{ matrix.arch }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target parasite-eve-ii-pc portable_graphics_tests portable_audio_tests portable_gameplay_tests
      # Filesystem host tests currently require POSIX APIs; run the portable regressions on Windows.
      - name: Portable host regression tests
        env:
          PSYZ_HEADLESS: '1'
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --no-tests=error -L "portable-graphics|portable-audio|portable-gameplay"
      - name: The executable starts
        run: |
          out=$(build/parasite-eve-ii-pc.exe --help 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'usage:'
      - name: Build the save editor
        shell: pwsh
        run: cargo build --manifest-path save-editor/Cargo.toml --locked --release
      - name: Package
        shell: pwsh
        run: |
          $version = if ('${{ inputs.version }}') { '${{ inputs.version }}' } elseif ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME -replace '^v','' } else { 'dev' }
          $game = "dist/Parasite-Eve-II-$version-windows-x86_64"
          $editor = "dist/Parasite-Eve-II-Save-Editor-$version-windows-x86_64"
          New-Item -ItemType Directory -Force $game, $editor | Out-Null
          Copy-Item build/parasite-eve-ii-pc.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md, CHANGELOG.md, recomplauncher.json $game
          git rev-parse HEAD | Set-Content "$game/source-commit.txt"
          Copy-Item save-editor/target/release/pe2-save-editor.exe, LICENSE $editor
          'Open pe2-save-editor.exe to edit a COPY of your save. Untested against retail saves.' | Set-Content "$editor/Read me.txt"
          Compress-Archive -Path $game -DestinationPath "$game-experimental.zip"
          Compress-Archive -Path $editor -DestinationPath "$editor.zip"
          Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS-windows

  save-editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the save editor
        run: |
          cargo test --manifest-path save-editor/Cargo.toml --locked
          cargo build --manifest-path save-editor/Cargo.toml --locked --release
